function model(){const ent=n("tab")-n("desc")-n("fin")-n("cp")-n("mcmv")-n("fgts"),N=Math.round(n("prazo")),flat=[];let pe=0,un=0;
const sn=[],mn=[];Pl.forEach(r=>{if(r.t=="period")pe+=r.q*r.v;else if(r.t=="unica")un+=r.q*r.v;else for(let i=0;i<r.q;i++)(r.t=="sinal"?sn:mn).push(r.v)});flat.push(...sn,...mn);

for(let m=1;m<=L;m++){const e0=flat[m-1]||0,fc=md=="comp"?Math.pow(1+i,m-1):md=="lin"?1+i*(m-1):1,
r={m,e:e0*fc,pe:m==3?pe:0,rc:m==2?n("recip"):0,av:m==2?n("avista"):0,un:m==L?un*fc:0,ev:m>=3&&m<=N?n("par")*p*Math.pow(1+g,m-3):0,d:m>=dI&&m<dI+dN?n("dv")/dN:0,x:m>=3&&m<3+xN?xt/xN:0};

function loadAdm(){const e=CFG.emps[AS.e],m=e.m[AS.m];$("a_emp").value=AS.e;$("a_mod").value=AS.m;AC.forEach(([k])=>$("a_"+k).value=e.c[k]);$("a_mode").value=e.c.mode;AM.forEach(([k])=>$("a_"+k).value=m[k]);$("a_ini").value=m.ini;m.st.forEach((x,i)=>{$("a_p"+(i+1)).value=x[0];$("a_q"+(i+1)).value=x[1]});AN.forEach(a=>["tab","desc","fin"].forEach(k=>$("a_"+a+"_"+k).value=m.a[a][k]));CFG.tx.steps.forEach((x,i)=>{$("a_s"+i+"l").value=x[0];$("a_s"+i+"t").value=x[1]});$("a_xi").value=CFG.tx.incc;$("a_xe").value=CFG.tx.ev}
function readAdm(){const e=CFG.emps[AS.e],m=e.m[AS.m],g=k=>parseFloat($("a_"+k).value)||0;AC.forEach(([k])=>e.c[k]=g(k));e.c.mode=$("a_mode").value;AM.forEach(([k])=>m[k]=g(k));m.ini=+$("a_ini").value;m.st=[1,2,3].map(i=>[g("p"+i),g("q"+i)]);AN.forEach(a=>["tab","desc","fin"].forEach(k=>m.a[a][k]=g(a+"_"+k)));CFG.tx.steps=[0,1,2,3].map(i=>[$("a_s"+i+"l").value,$("a_s"+i+"t").value]);CFG.tx.incc=$("a_xi").value;CFG.tx.ev=$("a_xe").value}
function adSel(){if(AS)readAdm();AS={e:$("a_emp").value,m:$("a_mod").value};loadAdm()}
async function salvar(){readAdm();const am=$("am");am.hidden=false;const html=SRC.replace(/(<script id="cfg" type="application\/json">)[\s\S]*?(<\/script>)/,(x,a,b)=>a+JSON.stringify(CFG)+b);
try{const A=await claude.use("artifact");await A.publish(html);am.className="msg";am.textContent="Salvo. Os corretores recebem a atualização ao recarregar o link."}catch(e){am.className="msg b";am.textContent="Não foi possível salvar aqui ("+(e&&(e.code||e.message)||"erro")+"). Copie a configuração abaixo e envie para o Claude atualizar.";$("aj").hidden=false;$("aj").value=JSON.stringify(CFG)}}
(async()=>{try{if(typeof claude=="undefined")return;const u=await claude.use("user");if(u&&(u.isOwner()||u.canEdit()))$("admb").hidden=false}catch(e){}})();
let DEF={},PL0,nvT=0;
function snap(){DEF={};document.querySelectorAll("#main input,#main select").forEach(e=>{if(e.id&&!/^pm\d$/.test(e.id))DEF[e.id]=e.value});PL0=JSON.stringify(Pl)}
function nova(){const b=$("nv");if(!nvT){b.textContent="Apagar tudo? Clique de novo";nvT=setTimeout(()=>{nvT=0;b.textContent="Nova simulação"},4000);return}
clearTimeout(nvT);nvT=0;b.textContent="Nova simulação";for(const id in DEF)$(id).value=DEF[id];Pl=JSON.parse(PL0);setMod();
$("doc").classList.remove("show");$("doc").innerHTML="";if(!$("pres").hidden)xp();go(0)}
setMod();$("mod").value="1";go(0);snap();
</script></body></html>
